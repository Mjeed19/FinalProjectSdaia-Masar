services:
  - type: web
    name: masar-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: masar-dashboard
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://masar-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
